<!DOCTYPE html>
<!--
  Dev harness. Never deployed (sync excludes _dev/*). Mounts each page via mountPage so the
  harness and the real pages exercise the same code path.

  Query flags:
    ?now=<ISO>   override Date.now() for isStale (P1.2)
    ?lang=en|fi  pick language explicitly (langExplicit = true)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kiekkokeskus — dev harness</title>
    <link rel="stylesheet" href="/kiekkokeskus/kk.css" />
    <link rel="stylesheet" href="/kiekkokeskus/kk-page.css" />
    <style>
      body { padding: 24px 0; }
      .harness-page { border-top: 2px dashed var(--kk-line); padding-top: 16px; margin-top: 24px; }
      .harness-tag { color: var(--kk-faint); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <section class="harness-page" data-page="bolts">
        <div class="harness-tag">/bolts preview</div>
        <div data-slot="header"></div>
        <div data-slot="stale" hidden></div>
        <div data-slot="error" hidden></div>
        <div class="kk-card">
          <h2 data-slot="skaters-title"></h2>
          <div data-slot="pills"></div>
          <div class="kk-scroll"><div data-slot="skaters"></div></div>
        </div>
        <div class="kk-card">
          <h2 data-slot="goalies-title"></h2>
          <div class="kk-scroll"><div data-slot="goalies"></div></div>
        </div>
        <footer data-slot="footer"></footer>
      </section>

      <!-- The /leijonat preview was dropped in PRP-08 (P1.1): the real page is served by
           scripts/preview.py --fresh. The /bolts preview above stays as a minimal
           shared-controller demo. -->
    </main>

    <script type="module">
      import { SKATER_COLUMNS, GOALIE_COLUMNS } from "/kiekkokeskus/columns.js";
      import { t } from "/kiekkokeskus/i18n.js";
      import { mountPage } from "/kiekkokeskus/page.js";

      // P1.2 — pin "now" so the stale banner can be exercised without touching the JSON.
      function harnessNow() {
        const raw = new URL(window.location.href).searchParams.get("now");
        if (!raw) return new Date();
        const d = new Date(raw);
        return Number.isNaN(d.getTime()) ? new Date() : d;
      }

      function slotsFor(section) {
        return {
          header: section.querySelector('[data-slot="header"]'),
          stale: section.querySelector('[data-slot="stale"]'),
          error: section.querySelector('[data-slot="error"]'),
          pills: section.querySelector('[data-slot="pills"]'),
          skaters: section.querySelector('[data-slot="skaters"]'),
          goalies: section.querySelector('[data-slot="goalies"]'),
          footer: section.querySelector('[data-slot="footer"]'),
          skatersTitle: section.querySelector('[data-slot="skaters-title"]'),
          goaliesTitle: section.querySelector('[data-slot="goalies-title"]'),
        };
      }

      const BOLTS_SKATER_COLUMNS = SKATER_COLUMNS.filter((c) => c.key !== "team");
      const BOLTS_GOALIE_COLUMNS = GOALIE_COLUMNS.filter((c) => c.key !== "team");

      mountPage({
        dataPath: "/data/kiekkokeskus/bolts.json",
        expectedSchemaVersion: 1,
        columns: BOLTS_SKATER_COLUMNS,
        goalieColumns: BOLTS_GOALIE_COLUMNS,
        titleKey: null,
        subtitle: (data, lang) => (data
          ? "/bolts preview (fresh data)"
          : "/bolts preview (loading or error)"),
        hero: null,
        now: harnessNow(),
        slots: slotsFor(document.querySelector('[data-page="bolts"]')),
        renderSections: ({ lang, slots }) => {
          slots.skatersTitle.textContent = t("table.skaters", null, lang);
          slots.goaliesTitle.textContent = t("table.goalies", null, lang);
        },
      });

      // /leijonat preview dropped in PRP-08 (P1.1): the real page lives at site/leijonat/
      // and is served by `python scripts/preview.py --fresh`. Keep the /bolts preview
      // above as a shared-controller demo.
    </script>
  </body>
</html>
